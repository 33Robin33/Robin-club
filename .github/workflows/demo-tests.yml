name: Synthetic demo tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - name: Run standard-library tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest -v 2>&1 | tee test-results.txt
      - name: Preserve synthetic test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: synthetic-test-results
          path: test-results.txt
          retention-days: 7
